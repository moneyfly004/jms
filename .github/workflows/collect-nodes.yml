name: 自动采集节点

on:
  schedule:
    # 每天 UTC 时间 02:00 运行（北京时间 10:00）
    - cron: '0 2 * * *'
  workflow_dispatch: # 允许手动触发

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 需要写入权限来推送代码
      
    steps:
    - name: 检出代码
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        
    - name: 设置 Go 环境
      uses: actions/setup-go@v5
      with:
        go-version: '1.21'
        
    - name: 检查 Sing-box 内核
      if: env.USE_SINGBOX != 'false'
      run: |
        echo "🔍 检查 sing-box 内核文件..."
        if [ -f "./sing-box-1.10.0-alpha.29-linux-amd64/sing-box" ]; then
          chmod +x ./sing-box-1.10.0-alpha.29-linux-amd64/sing-box
          echo "✅ 找到本地 sing-box 内核"
          ./sing-box-1.10.0-alpha.29-linux-amd64/sing-box version
        else
          echo "⚠️ 未找到本地 sing-box 内核，尝试下载..."
          SINGBOX_VERSION="1.10.0-alpha.29"
          ARCH="amd64"
          DOWNLOAD_URL="https://github.com/SagerNet/sing-box/releases/download/v${SINGBOX_VERSION}/sing-box-${SINGBOX_VERSION}-linux-${ARCH}.tar.gz"
          curl -Lo sing-box.tar.gz "${DOWNLOAD_URL}"
          tar -xzf sing-box.tar.gz
          chmod +x sing-box-${SINGBOX_VERSION}-linux-${ARCH}/sing-box
          echo "✅ sing-box 下载完成"
          ./sing-box-${SINGBOX_VERSION}-linux-${ARCH}/sing-box version
        fi
      env:
        USE_SINGBOX: ${{ secrets.USE_SINGBOX || 'true' }}
        
    - name: 运行采集程序
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITHUB_REPO: ${{ secrets.GITHUB_REPO }}
        GIST_ID: ${{ secrets.GIST_ID }}
        GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
        SUB_GIST_ID: ${{ secrets.SUB_GIST_ID }}
        MAX_CONCURRENCY: ${{ secrets.MAX_CONCURRENCY || '10' }}
        TEST_TIMEOUT: ${{ secrets.TEST_TIMEOUT || '10' }}
        SAVE_ALL_NODES: ${{ secrets.SAVE_ALL_NODES || 'false' }}
        USE_SINGBOX: ${{ secrets.USE_SINGBOX || 'true' }}
        TEST_SPEED: ${{ secrets.TEST_SPEED || 'false' }}
        SINGBOX_PATH: ./sing-box-1.10.0-alpha.29-linux-amd64/sing-box
      run: |
        go run main.go config.go node_parser.go gist.go singbox.go glados_parser.go glados_collector.go
        
    - name: 提交并推送结果
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        
        # 检查并提交 nodes.txt
        if [ -f nodes.txt ]; then
          node_count=$(wc -l < nodes.txt | tr -d ' ')
          echo "📊 nodes.txt 包含 $node_count 个节点"
          git add nodes.txt
        else
          echo "⚠️ nodes.txt 文件不存在"
        fi
        
        # 检查并提交 sub.txt
        if [ -f sub.txt ]; then
          sub_count=$(wc -l < sub.txt | tr -d ' ')
          echo "📊 sub.txt 包含 $sub_count 个订阅节点"
          git add sub.txt
        else
          echo "⚠️ sub.txt 文件不存在"
        fi
        
        # 检查是否有未提交的更改
        if git diff --staged --quiet; then
          echo "ℹ️ 没有新的节点更新（文件内容未变化）"
        else
          echo "✅ 检测到节点更新，准备提交..."
          commit_msg="自动更新节点列表 [$(date +'%Y-%m-%d %H:%M:%S')]"
          if [ -f nodes.txt ]; then
            commit_msg="$commit_msg - nodes: $node_count"
          fi
          if [ -f sub.txt ]; then
            commit_msg="$commit_msg - sub: $sub_count"
          fi
          git commit -m "$commit_msg"
          git push
          echo "✅ 已成功推送到 GitHub"
        fi

