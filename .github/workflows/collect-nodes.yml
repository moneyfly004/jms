name: 自动采集节点

on:
  schedule:
    # 每天 UTC 时间 02:00 运行（北京时间 10:00）
    - cron: '0 2 * * *'
  workflow_dispatch: # 允许手动触发

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 需要写入权限来推送代码
      
    steps:
    - name: 检出代码
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        
    - name: 设置 Go 环境
      uses: actions/setup-go@v5
      with:
        go-version: '1.21'
        
    - name: 运行采集程序
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITHUB_REPO: ${{ secrets.GITHUB_REPO }}
        GIST_ID: ${{ secrets.GIST_ID }}
        GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
        MAX_CONCURRENCY: ${{ secrets.MAX_CONCURRENCY || '10' }}
        TEST_TIMEOUT: ${{ secrets.TEST_TIMEOUT || '10' }}
        SAVE_ALL_NODES: ${{ secrets.SAVE_ALL_NODES || 'false' }}
      run: |
        go run main.go config.go node_parser.go gist.go
        
    - name: 提交并推送结果
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        
        # 检查文件是否存在
        if [ ! -f nodes.txt ]; then
          echo "❌ nodes.txt 文件不存在"
          exit 1
        fi
        
        # 显示文件信息
        node_count=$(wc -l < nodes.txt | tr -d ' ')
        echo "📊 nodes.txt 包含 $node_count 个节点"
        
        # 添加文件并检查变化
        git add nodes.txt
        
        # 检查是否有未提交的更改
        if git diff --staged --quiet; then
          echo "ℹ️ 没有新的节点更新（文件内容未变化）"
        else
          echo "✅ 检测到节点更新，准备提交..."
          git commit -m "自动更新节点列表 [$(date +'%Y-%m-%d %H:%M:%S')] - $node_count 个节点"
          git push
          echo "✅ 已成功推送到 GitHub"
        fi

