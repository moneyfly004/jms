name: 自动采集节点

on:
  schedule:
    # 每天 UTC 时间 02:00 运行（北京时间 10:00）
    - cron: '0 2 * * *'
  workflow_dispatch: # 允许手动触发

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write # 需要写入权限来推送代码
      
    steps:
    - name: 检出代码
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        fetch-depth: 0  # 获取完整历史记录，避免推送冲突
        
    - name: 设置 Go 环境
      uses: actions/setup-go@v5
      with:
        go-version: '1.21'
        
    - name: 检查 Sing-box 内核
      if: env.USE_SINGBOX != 'false'
      run: |
        echo "🔍 检查 sing-box 内核文件..."
        if [ -f "./sing-box-1.10.0-alpha.29-linux-amd64/sing-box" ]; then
          chmod +x ./sing-box-1.10.0-alpha.29-linux-amd64/sing-box
          echo "✅ 找到本地 sing-box 内核"
          ./sing-box-1.10.0-alpha.29-linux-amd64/sing-box version
        else
          echo "⚠️ 未找到本地 sing-box 内核，尝试下载..."
          SINGBOX_VERSION="1.10.0-alpha.29"
          ARCH="amd64"
          DOWNLOAD_URL="https://github.com/SagerNet/sing-box/releases/download/v${SINGBOX_VERSION}/sing-box-${SINGBOX_VERSION}-linux-${ARCH}.tar.gz"
          curl -Lo sing-box.tar.gz "${DOWNLOAD_URL}"
          tar -xzf sing-box.tar.gz
          chmod +x sing-box-${SINGBOX_VERSION}-linux-${ARCH}/sing-box
          echo "✅ sing-box 下载完成"
          ./sing-box-${SINGBOX_VERSION}-linux-${ARCH}/sing-box version
        fi
      env:
        USE_SINGBOX: ${{ secrets.USE_SINGBOX || 'true' }}
        
    - name: 运行采集程序
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITHUB_REPO: ${{ secrets.GITHUB_REPO }}
        GIST_ID: ${{ secrets.GIST_ID }}
        GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
        MAX_CONCURRENCY: ${{ secrets.MAX_CONCURRENCY || '10' }}
        TEST_TIMEOUT: ${{ secrets.TEST_TIMEOUT || '10' }}
        SAVE_ALL_NODES: ${{ secrets.SAVE_ALL_NODES || 'false' }}
        USE_SINGBOX: ${{ secrets.USE_SINGBOX || 'true' }}
        TEST_SPEED: ${{ secrets.TEST_SPEED || 'false' }}
        SINGBOX_PATH: ./sing-box-1.10.0-alpha.29-linux-amd64/sing-box
      run: |
        go run main.go config.go node_parser.go gist.go singbox.go subscribe.go
        
    - name: 提交并推送结果
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"

        # 检查并提交 keywords.txt（可能被自动清理）
        if [ -f keywords.txt ]; then
          git add keywords.txt
        fi

        # 检查并提交 links.txt
        if [ -f links.txt ]; then
          link_count=$(wc -l < links.txt | tr -d ' ')
          echo "📊 links.txt 包含 $link_count 个有效订阅链接"
          git add links.txt
        fi

        # 检查并提交 nodes.txt
        if [ -f nodes.txt ]; then
          node_count=$(wc -l < nodes.txt | tr -d ' ')
          echo "📊 nodes.txt 包含 $node_count 个节点"
          git add nodes.txt
        else
          echo "⚠️ nodes.txt 文件不存在"
        fi
        
        # 检查是否有未提交的更改
        if git diff --staged --quiet; then
          echo "ℹ️ 没有新的节点更新（文件内容未变化）"
        else
          echo "✅ 检测到更新，准备提交..."
          commit_msg="自动更新 [$(date +'%Y-%m-%d %H:%M:%S')]"
          if [ -f links.txt ]; then
            commit_msg="$commit_msg - links: $link_count"
          fi
          if [ -f nodes.txt ]; then
            commit_msg="$commit_msg, nodes: $node_count"
          fi
          git commit -m "$commit_msg"
          
          # 在推送前先拉取远程更改，避免冲突
          echo "🔄 拉取远程更改..."
          git pull --rebase origin main || git pull origin main
          
          # 推送更改
          echo "📤 推送更改到远程仓库..."
          git push origin main
          echo "✅ 已成功推送到 GitHub"
        fi

