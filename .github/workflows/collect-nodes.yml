name: 自动采集节点
on:
  schedule:
    - cron: '0 2 * * *' # 每天 UTC 02:00 (北京 10:00)
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: 缓存 Go 模块
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: 设置 Go 环境
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: 检查 Sing-box 内核
        if: env.USE_SINGBOX != 'false'
        run: |
          echo "🔍 检查 sing-box 内核文件..."
          if [ -f "./sing-box-1.10.0-alpha.29-linux-amd64/sing-box" ]; then
            chmod +x ./sing-box-1.10.0-alpha.29-linux-amd64/sing-box
            echo "✅ 找到本地 sing-box 内核"
            ./sing-box-1.10.0-alpha.29-linux-amd64/sing-box version
          else
            echo "⚠️ 未找到本地内核，尝试下载..."
            SINGBOX_VERSION="1.10.0-alpha.29"
            ARCH="amd64"
            DOWNLOAD_URL="https://github.com/SagerNet/sing-box/releases/download/v${SINGBOX_VERSION}/sing-box-${SINGBOX_VERSION}-linux-${ARCH}.tar.gz"
            curl -L -o sing-box.tar.gz "${DOWNLOAD_URL}"
            tar -xzf sing-box.tar.gz
            chmod +x sing-box-${SINGBOX_VERSION}-linux-${ARCH}/sing-box
            echo "✅ sing-box 下载完成"
          fi
        env:
          USE_SINGBOX: ${{ secrets.USE_SINGBOX || 'true' }}

      - name: 运行采集程序
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          MAX_CONCURRENCY: ${{ secrets.MAX_CONCURRENCY || '30' }}
          TEST_TIMEOUT: ${{ secrets.TEST_TIMEOUT || '8' }}
          USE_SINGBOX: ${{ secrets.USE_SINGBOX || 'true' }}
          SINGBOX_PATH: ./sing-box-1.10.0-alpha.29-linux-amd64/sing-box
        run: |
          go run main.go node_parser.go gist.go singbox.go

      - name: 提交并推送结果
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          link_count=0
          node_count=0
          removed_kw=""

          if [ -f links.txt ]; then
            link_count=$(wc -l < links.txt | tr -d ' ')
            git add links.txt
          fi

          if [ -f nodes.txt ]; then
            node_count=$(base64 -d < nodes.txt 2>/dev/null | grep -c . || echo "0")
            git add nodes.txt
          fi

          if [ -f keywords.txt ]; then
            git add keywords.txt
            removed_kw=$(git diff --staged --unified=0 keywords.txt 2>/dev/null | grep '^-[^-]' | sed 's/^-//' | grep -v '^#' | tr '\n' ',' | sed 's/,$//')
          fi

          if git diff --staged --quiet; then
            echo "无更新，跳过提交"
          else
            commit_msg="自动更新节点列表 [$(date +'%Y-%m-%d %H:%M')]"
            parts=""
            [ "$link_count" -gt 0 ] && parts="links: ${link_count}"
            [ "$node_count" -gt 0 ] && parts="${parts:+$parts, }nodes: ${node_count}"
            [ -n "$removed_kw" ] && parts="${parts:+$parts, }removed: [${removed_kw}]"
            [ -n "$parts" ] && commit_msg="$commit_msg - $parts"

            git commit -m "$commit_msg"
            git pull --rebase origin main || git pull origin main
            git push origin main
            echo "✅ 推送完成 | $commit_msg"
          fi
