name: 发布到 GitHub Pages

# 注意：私有仓库的 GitHub Pages 在免费账户中不可用
# 如果仓库是私有的，此工作流会失败，这是正常的
# 请使用 GitHub Gist 方案（已自动配置在 collect-nodes.yml 中）

on:
  push:
    branches:
      - main
    paths:
      - 'nodes.txt'
  workflow_dispatch:

# 如果仓库是私有的，此工作流会被禁用
# 取消下面的注释来禁用此工作流
# workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    # 如果是私有仓库，此 job 会失败，这是正常的
    # 请使用 Gist 方案替代
    steps:
    - name: 检出代码
      uses: actions/checkout@v4
      
    - name: 设置 Pages
      uses: actions/configure-pages@v4
      
    - name: 准备 Pages 内容
      run: |
        mkdir -p _site
        cp nodes.txt _site/
        echo "# JMS 节点订阅" > _site/index.html
        echo "<p>订阅地址: <a href='nodes.txt'>nodes.txt</a></p>" >> _site/index.html
        echo "<p>更新时间: $(date)</p>" >> _site/index.html
        
    - name: 上传到 Pages
      uses: actions/upload-pages-artifact@v3
      with:
        path: '_site'
        
    - name: 部署到 GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4

