name: 发布到 GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'nodes.txt'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: 检出代码
      uses: actions/checkout@v4
      
    - name: 设置 Pages
      uses: actions/configure-pages@v4
      
    - name: 准备 Pages 内容
      run: |
        mkdir -p _site
        cp nodes.txt _site/
        echo "# JMS 节点订阅" > _site/index.html
        echo "<p>订阅地址: <a href='nodes.txt'>nodes.txt</a></p>" >> _site/index.html
        echo "<p>更新时间: $(date)</p>" >> _site/index.html
        
    - name: 上传到 Pages
      uses: actions/upload-pages-artifact@v3
      with:
        path: '_site'
        
    - name: 部署到 GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4

